[project]
name = "xueban-api"
version = "0.1.0"
description = "学伴（XueBan）后端服务"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "genanki>=0.13.0",
    "python-multipart>=0.0.18",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pyjwt>=2.10.0",
    "bcrypt>=4.2.0",
    "boto3>=1.35.0",
    "httpx>=0.27.0",
    "langfuse>=3.0.0",
    "pgvector>=0.3.6",
    "openpyxl>=3.1.5",
    "pypdf>=5.1.0",
    "arq>=0.26.0",
    "sympy>=1.13.0",
    "fpdf2>=2.8.0",
    # §5.2 ③ 要求讲解 HTML 过 DOMPurify 级白名单消毒。手写 HTML 解析器是安全
    # 缺陷的重灾区，而 bleach 是被广泛审计的纯 Python 实现（165KB，无二进制扩展、
    # 依赖只有 webencodings），是这里唯一合理的取舍。
    "bleach>=6.2.0",
    # bleach 的 CSS 属性级消毒（讲解页要放行圆角/阴影/flex 这类表现属性，
    # 而默认白名单只有十来条排版属性）依赖 tinycss2，28KB 纯 Python。
    "tinycss2>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.24.0",
    "factory-boy>=3.3.1",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# 中文项目：全角标点属正常书写，不做歧义告警
# B008：FastAPI 的标准写法就是在参数默认值中使用 Depends()，予以放行
ignore = ["RUF001", "RUF002", "RUF003", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
# 自动生成的迁移脚本不做行宽等风格约束
"migrations/versions/*" = ["E501"]
# 题库/词表数据按行存放（长中文题干与词典例句），不做行宽约束
"app/data/demo_questions.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "."
exclude = ["tests", "migrations"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "langfuse.*", "bcrypt.*", "factory.*", "openpyxl.*", "pypdf.*", "pgvector.*", "arq.*", "sympy.*", "genanki.*", "bleach.*", "tinycss2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# 显式把 services/api 加入 sys.path：确保 `pytest` 控制台脚本与 `python -m pytest` 均可导入 tests.*
pythonpath = ["."]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["app"]
branch = true
# SQLAlchemy 异步桥接依赖 greenlet，显式声明并发模型保证代码行被正确追踪
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
