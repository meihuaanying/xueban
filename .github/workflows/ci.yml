name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  web:
    name: Web（lint / typecheck / test / build / e2e / lighthouse）
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: xueban
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: xueban
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xueban -d xueban"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Playwright/uvicorn 使用的 API 连接串与解释器（CI 无 .venv，用系统 python）
      DATABASE_URL: postgresql+asyncpg://xueban:change-me@localhost:5432/xueban
      ENVIRONMENT: development
      PLAYWRIGHT_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @xueban/core test
      - run: pnpm --filter @xueban/ui test
      - run: pnpm --filter @xueban/web lint
      - run: pnpm --filter @xueban/web typecheck
      - run: pnpm --filter @xueban/web test
      - name: 构建产物（E2E 与 Lighthouse 共用）
        run: pnpm --filter @xueban/web build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装 API 依赖
        working-directory: services/api
        run: pip install -e ".[dev]"
      - name: 迁移数据库（E2E 注册链路所需）
        working-directory: services/api
        run: alembic upgrade head
      - name: 安装 Playwright 浏览器
        run: pnpm --filter @xueban/web exec playwright install --with-deps chromium
      - name: E2E（含 axe 无障碍与 SEO 基建断言）
        run: pnpm test:e2e:web
      - name: Lighthouse CI（Perf≥90 / A11y≥95 / BP≥95 / SEO≥95）
        # ubuntu-latest 预装 Google Chrome，lhci 可直接启动
        run: pnpm exec lhci autorun
      - name: 上传 E2E 报告（失败时保留现场）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            .lighthouseci
          if-no-files-found: ignore

  desktop:
    name: Desktop（lint / typecheck / test / build / bundle）
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: appimage,deb
          - os: macos-14
            bundles: dmg
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @xueban/desktop lint
      - run: pnpm --filter @xueban/desktop typecheck
      - run: pnpm --filter @xueban/desktop test
      - run: pnpm --filter @xueban/desktop build
      - name: Rust 工具链
        uses: dtolnay/rust-toolchain@stable
      - name: Linux 系统依赖（WebKitGTK + AppImage FUSE）
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libfuse2
      - name: 构建安装包
        env:
          # 无 FUSE 的容器环境：linuxdeploy 以解包方式运行
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: pnpm --filter @xueban/desktop exec tauri build --bundles ${{ matrix.bundles }}
      - name: 上传三平台安装包
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/**
            apps/desktop/src-tauri/target/release/xueban-desktop*
          if-no-files-found: error

  desktop-e2e:
    name: Desktop E2E（Playwright + 本机 API）
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: xueban
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: xueban
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xueban -d xueban"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://xueban:change-me@localhost:5432/xueban
      ENVIRONMENT: development
      PLAYWRIGHT_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @xueban/desktop build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装 API 依赖并迁移
        working-directory: services/api
        run: |
          pip install -e ".[dev]"
          alembic upgrade head
      - name: 播种演示数据（诊断/练习用例依赖题库与知识图谱）
        working-directory: services/api
        run: |
          python -m scripts.seed_knowledge_graph
          python -m scripts.seed_demo_questions
      - name: 安装 Playwright 浏览器
        run: pnpm --filter @xueban/desktop exec playwright install --with-deps chromium
      - name: 桌面端 E2E（24 条，含同步/引导/三态/暗色/陪练/判题）
        run: pnpm test:e2e:desktop
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-e2e-report
          path: |
            apps/desktop/playwright-report
            apps/desktop/test-results
          if-no-files-found: ignore

  mobile:
    name: Mobile（lint / typecheck / test / android bundle）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @xueban/mobile lint
      - run: pnpm --filter @xueban/mobile typecheck
      - run: pnpm --filter @xueban/mobile test
      - run: pnpm --filter @xueban/mobile build

  mobile-apk:
    name: Mobile APK + Maestro（Android 模拟器）
    runs-on: ubuntu-latest
    needs: mobile
    # 护栏：模拟器无硬件加速，命令执行慢（每步数十秒）；90 分钟强制失败，避免挂起
    timeout-minutes: 90
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: xueban
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: xueban
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xueban -d xueban"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://xueban:change-me@localhost:5432/xueban
      ENVIRONMENT: development
      # 模拟器经 adb reverse 访问宿主（127.0.0.1:8000 → 宿主 8000），避免 10.0.2.2 路由差异
      EXPO_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
      # 仅 CI 联调允许明文 HTTP（生产构建不开启，见 apps/mobile/plugins/with-cleartext.js）
      EXPO_PUBLIC_ALLOW_CLEARTEXT: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pnpm install --frozen-lockfile
      - name: 安装 API 依赖并迁移 + 播种（模拟器用例依赖题库）
        working-directory: services/api
        run: |
          pip install -e ".[dev]"
          alembic upgrade head
          python -m scripts.seed_knowledge_graph
          python -m scripts.seed_demo_questions
      - name: 预构建 Android 工程
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install
      - name: 构建 release APK（Expo 模板默认使用 debug keystore 签名）
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease -x lint -x test
      - name: 记录 APK 体积（门禁 ≤80MB）
        run: |
          ls -l apps/mobile/android/app/build/outputs/apk/release/
          SIZE=$(stat -c%s apps/mobile/android/app/build/outputs/apk/release/app-release.apk)
          echo "APK size: $SIZE bytes"
          test "$SIZE" -le 83886080
      - uses: actions/upload-artifact@v4
        with:
          name: xueban-android-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: 启动模拟器并跑 Maestro 核心旅程
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MAESTRO_CLI_NO_ANALYTICS: "1"
          # 无硬件加速的模拟器启动 Maestro driver 较慢，默认超时不够
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "600000"
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_5
          # 低配模拟器易触发 System UI ANR；提高内存/核数并关闭动画
          # 注意：不要覆盖 emulator-options（默认含无头模式 -no-window）
          ram-size: 4096
          cores: 4
          disable-animations: true
          # 启用硬件键盘并禁用软键盘，避免软键盘遮挡表单（hideKeyboard 会触发 BACK 退出应用）
          enable-hw-keyboard: true
          # 注意：runner 按行执行，因此整段逻辑收敛到脚本文件（见 apps/mobile/maestro/ci-run.sh）
          script: |
            bash apps/mobile/maestro/ci-run.sh
      - name: API 日志（诊断）
        if: always()
        run: |
          echo "--- uvicorn ---"; pgrep -af uvicorn || true
          echo "--- /tmp/api.log ---"; tail -80 /tmp/api.log || true
      - name: 上传 Maestro 调试产物（失败时）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug
          path: |
            ~/.maestro/tests/**
            /tmp/maestro-artifacts/**
          if-no-files-found: ignore

  api:
    name: API（ruff / mypy / pytest）
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: xueban
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: xueban
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xueban -d xueban"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖
        working-directory: services/api
        run: pip install -e ".[dev]"
      - name: 启动 MinIO（对象存储集成测试）
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=xueban-minio \
            -e MINIO_ROOT_PASSWORD=change-me-please \
            quay.io/minio/minio server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && exit 0 || sleep 2
          done
          docker logs minio || true
          exit 1
      - name: 创建 MinIO 桶
        run: |
          docker run --rm --network host --entrypoint sh quay.io/minio/mc -c \
            "mc alias set local http://127.0.0.1:9000 xueban-minio change-me-please && mc mb --ignore-existing local/xueban"
      - name: ruff
        working-directory: services/api
        run: ruff check .
      - name: mypy（strict）
        working-directory: services/api
        run: mypy --strict app
      - name: pytest（覆盖率门禁 ≥85%，规格书 §7）
        working-directory: services/api
        run: pytest --cov=app --cov-fail-under=85

  compose:
    name: Docker Compose 校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f infra/docker/docker-compose.yml config -q
