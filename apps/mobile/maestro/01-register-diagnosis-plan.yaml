# Maestro：注册 → 诊断 → 查看计划 → 打卡（T6.2 验收流程）
# 运行：maestro test maestro/01-register-diagnosis-plan.yaml -e PHONE=13900000001
appId: com.xueban.mobile
name: 注册 → 诊断 → 计划 → 打卡
---
- launchApp:
    clearState: true
# CI 低配模拟器可能出现 "System UI isn't responding" 弹窗，自动等待/跳过
- runFlow:
    when:
      visible: "Wait"
    commands:
      - tapOn: "Wait"
# 冷启动（尤其 CI 模拟器）可能超过 Maestro 默认等待，放宽到 120s
- extendedWaitUntil:
    visible: "登录"
    timeout: 180000
- runFlow:
    when:
      visible: "Wait"
    commands:
      - tapOn: "Wait"
- tapOn: "注册"
# 确认已切换到注册模式（按钮文案变化），避免键盘/渲染时序导致未切换
- assertVisible: "注册并登录"
- tapOn:
    id: "phone-input"
- inputText: "${PHONE}"
# 收起键盘：避免软键盘遮挡密码框与提交按钮（低配模拟器尤甚）
- hideKeyboard
- tapOn:
    id: "password-input"
- inputText: "E2e-pass-1234"
- hideKeyboard
- tapOn:
    id: "submit-auth"
- assertVisible: "今日任务"
- tapOn: "开始诊断"
- assertVisible: "开始诊断"
- tapOn:
    id: "start-diagnosis"
# 20 题自适应诊断：选择题点 A，填空题走“输入答案”占位，再提交
- repeat:
    times: 20
    commands:
      - runFlow:
          when:
            visible:
              id: "option-A"
          commands:
            - tapOn:
                id: "option-A"
      - runFlow:
          when:
            notVisible:
              id: "option-A"
          commands:
            - tapOn:
                id: "fill-answer"
      - tapOn:
          id: "submit-answer"
- assertVisible:
    id: "diagnosis-report"
- back
- tapOn: "学习规划"
- assertVisible:
    id: "plan-today"
- back
- assertVisible: "今日任务"
- tapOn: "打卡"
- assertVisible: "已完成"
