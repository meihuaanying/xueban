# Maestro：练习作答 → 错题本 → 重练（T6.4 验收流程）
# 运行：maestro test maestro/02-practice-mistake-loop.yaml -e PHONE=13900000002
appId: com.xueban.mobile
name: 练习 → 错题 → 重练
---
- launchApp:
    clearState: true
# CI 低配模拟器可能出现 "System UI isn't responding" 弹窗，自动等待/跳过
- runFlow:
    when:
      visible: "Wait"
    commands:
      - tapOn: "Wait"
# 冷启动（尤其 CI 模拟器）可能超过 Maestro 默认等待，放宽到 120s
- extendedWaitUntil:
    visible: "注册"
    timeout: 180000
- runFlow:
    when:
      visible: "Wait"
    commands:
      - tapOn: "Wait"
- tapOn: "注册"
# 确认已切换到注册模式（按钮文案变化），避免键盘/渲染时序导致未切换
- assertVisible: "注册并登录"
- tapOn:
    id: "phone-input"
- inputText: "${PHONE}"
- tapOn:
    id: "password-input"
- inputText: "E2e-pass-1234"
- tapOn:
    id: "submit-auth"
- extendedWaitUntil:
    visible: "今日任务"
    timeout: 90000
- tapOn: "练习"
- tapOn:
    id: "generate-practice"
- assertVisible:
    id: "practice-question"
# 故意选 B（多数题目正确答案为 A），产生错题
- runFlow:
    when:
      visible:
        id: "option-B"
    commands:
      - tapOn:
          id: "option-B"
      - tapOn:
          id: "submit-practice"
# 答错后：错题本自动收录（文本为「错题本（N）」，用 testID 断言）
- assertVisible:
    id: "mistake-list"
- tapOn: "错题重练"
# 重练面板在列表下方，必要时向下滚动
- scrollUntilVisible:
    element:
      id: "repractice-panel"
    direction: DOWN
    timeout: 30000
- assertVisible:
    id: "repractice-panel"
